name: memoBrain
locale: en

paths:
  memory: ./memory
  index: ./scripts/index

server:
  host: 127.0.0.1
  port: 3333

sync:
  strategy: git
  # User maintains a private GitHub repo.
  # Pull before editing on another laptop; push after writing.

ai:
  enabled: false
  provider: none          # none | ollama | openai | anthropic | custom
  endpoint: ""
  model: ""

id:
  strategy: filename      # filename | frontmatter
  slugRules: lowercase-dash
  onDuplicate: warn       # warn | error

graph:
  # Set this first. The root note file must use the same id (filename without .md).
  rootHub:
    id: memobrain-notes
    title: "memoBrain's notes"
  maxLevel: 3
  levels:
    1:
      background: "#2d5a4a"
      border: "#1c3f34"
      label: "memoBrain's notes"
    2:
      background: "#3d6ea8"
      border: "#2a4d78"
      label: level 2
    3:
      background: "#c47b2b"
      border: "#8f5818"
      label: level 3
  unassigned:
    background: "#8a8478"
    border: "#5f5a52"
    label: unassigned
  journal:
    background: "#2d5a4a"
    border: "#1c3f34"
    label: journal

sources:
  - id: brain
    path: ./memory
    kind: brain
